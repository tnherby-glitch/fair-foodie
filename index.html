<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<meta name="description" content="MN Fair Foodie Guide — search, rate, review, and map the best food at the Minnesota State Fair.">
<title>MN Fair Foodie Guide</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌭</text></svg>">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <header id="topbar" class="topbar" role="banner">
    <a href="#/home" class="brand" aria-label="MN Fair Foodie Guide home">
      <span class="brand-icon" aria-hidden="true"><svg class="pup-ico" viewBox="0 0 24 24"><rect class="pup-stick" x="11.1" y="13.5" width="1.8" height="9.5" rx=".9"></rect><rect class="pup-body" x="5.4" y="1.2" width="13.2" height="15.8" rx="6.6"></rect><path class="pup-glaze" d="M8 5.4c1.6 1.1 6.4 1.1 8 0M8 8.2c1.6 1.1 6.4 1.1 8 0M8 11c1.6 1.1 6.4 1.1 8 0"></path></svg></span>
      <span class="brand-name">Fair<b>Foodie</b></span>
    </a>
    <div class="topbar-actions">
      <button id="bellBtn" class="icon-btn" aria-label="Notifications" onclick="location.hash='#/notifications'">
        🔔<span id="bellBadge" class="badge-dot" hidden></span>
      </button>
      <button id="avatarBtn" class="avatar-btn" aria-label="Your profile" onclick="location.hash='#/profile'">🙂</button>
    </div>
  </header>

  <main id="view" tabindex="-1" aria-live="polite"></main>

  <nav id="tabbar" class="tabbar" aria-label="Main navigation">
    <a href="#/home" data-tab="home" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5M5 9.5V21h14V9.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Home</a>
    <a href="#/search" data-tab="search" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4" stroke-linecap="round"/></svg>
      Search</a>
    <a href="#/map" data-tab="map" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-5.6-7-11a7 7 0 0 1 14 0c0 5.4-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
      Map</a>
    <a href="#/lists" data-tab="lists" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-8-4.8-8-10.4C4 6.9 6.4 5 8.8 5c1.6 0 2.7.8 3.2 1.6C12.5 5.8 13.6 5 15.2 5 17.6 5 20 6.9 20 10.1c0 5.6-8 10.4-8 10.4Z" stroke-linejoin="round"/></svg>
      Lists</a>
    <a href="#/feed" data-tab="feed" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3 2.9-4.5 5.5-4.5s4.9 1.5 5.5 4.5M16 5.3a3.2 3.2 0 0 1 0 5.4M17.5 14.7c1.7.7 2.7 2 3 4.3" stroke-linecap="round"/></svg>
      Feed</a>
  </nav>

  <div id="toasts" class="toasts" aria-live="assertive"></div>
  <div id="modalRoot"></div>
</div>

<script src="js/catalog.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/views.js"></script>
<script src="js/views2.js"></script>
<script src="js/app.js"></script>
</body>
</html>
